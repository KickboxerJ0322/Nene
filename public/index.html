<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nene</title>
    <link rel="icon" type="image/png" href="/nene-logo.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="brand-lockup">
          <img class="brand-logo" src="/nene-logo.png" alt="Nene logo" />
          <h1>Nene</h1>
        </div>
        <div class="hero-status">
          <span id="statusDot" class="status-dot idle"></span>
          <span id="statusText">未接続</span>
        </div>
      </header>

      <main class="grid">
        <section class="panel camera-panel">
          <div class="panel-head">
            <h2>Camera</h2>
            <span id="cameraStateBadge" class="badge">Camera Ready</span>
          </div>
          <div class="camera-frame">
            <video id="cameraPreview" autoplay playsinline muted></video>
            <div id="cameraFallback" class="camera-fallback">
              <p>背面カメラを起動すると、ここにプレビューが表示されます。</p>
            </div>
          </div>
          <canvas id="captureCanvas" hidden></canvas>
        </section>

        <section class="panel control-panel">
          <div class="panel-head">
            <h2>Session</h2>
            <span id="modelBadge" class="badge">Gemini Live</span>
          </div>

          <div class="button-row">
            <button id="connectButton" class="primary-button" type="button">Neneを起動</button>
            <button id="disconnectButton" class="secondary-button" type="button" disabled>終了</button>
          </div>

          <div class="toggle-grid">
            <label class="toggle-card" for="micEnabled">
              <span>マイクを使う</span>
              <span class="ios-switch">
                <input id="micEnabled" type="checkbox" checked />
                <span class="ios-slider"></span>
              </span>
            </label>
            <label class="toggle-card" for="cameraEnabled">
              <span>カメラを使う</span>
              <span class="ios-switch">
                <input id="cameraEnabled" type="checkbox" checked />
                <span class="ios-slider"></span>
              </span>
            </label>
            <label class="toggle-card" for="searchEnabled">
              <span>Google Searchを使う</span>
              <span class="ios-switch">
                <input id="searchEnabled" type="checkbox" checked />
                <span class="ios-slider"></span>
              </span>
            </label>
          </div>

          <label class="stack">
            <span>Voice</span>
            <select id="voiceName"></select>
          </label>

          <form id="textForm" class="text-form">
            <label class="stack">
              <span>テキストでも話しかける</span>
              <textarea
                id="textInput"
                rows="3"
                placeholder="例: 目の前にある物を説明して"
              ></textarea>
            </label>
            <button class="ghost-button" type="submit">送信</button>
          </form>

          <div class="hint-box">
            <p>使い方</p>
            <p>1. `Neneを起動` を押す</p>
            <p>2. カメラとマイクの許可を出す</p>
            <p>3. そのまま話しかける</p>
          </div>
        </section>

        <section class="panel transcript-panel">
          <div class="panel-head">
            <h2>Transcript</h2>
            <span id="tokenCounter" class="badge">Tokens: -</span>
          </div>
          <div id="transcriptList" class="transcript-list"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
