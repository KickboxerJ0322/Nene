<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nene</title>
    <link rel="icon" type="image/png" href="/nene-logo.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="brand-lockup">
          <img class="brand-logo" src="/nene-logo.png" alt="Nene logo" />
          <h1>Nene</h1>
        </div>
      </header>

      <main class="grid">
        <section class="panel control-panel">
          <div class="panel-head">
            <div class="session-headline">
              <h2>Session</h2>
              <div class="session-header-right">
                <div class="hero-status">
                  <span id="statusDot" class="status-dot idle"></span>
                  <span id="statusText">未接続</span>
                </div>
                <span id="modelBadge" class="badge">Gemini Live</span>
              </div>
            </div>
          </div>

          <div class="button-row">
            <button id="connectButton" class="primary-button" type="button">Neneを起動</button>
            <button id="disconnectButton" class="secondary-button" type="button" disabled>終了</button>
          </div>

          <div id="sessionLogoStage" class="session-logo-stage" aria-hidden="true">
            <div class="session-logo-screen">
              <div class="session-logo-glow"></div>
              <img id="sessionLogoImage" class="session-logo-image" src="/nene-logo.png" alt="Nene logo" />
            </div>
          </div>

          <div class="toggle-grid">
            <label class="toggle-card" for="micEnabled">
              <span>マイクを使う</span>
              <span class="ios-switch">
                <input id="micEnabled" type="checkbox" checked />
                <span class="ios-slider"></span>
              </span>
            </label>
            <label class="toggle-card" for="cameraEnabled">
              <span>カメラを使う</span>
              <span class="ios-switch">
                <input id="cameraEnabled" type="checkbox" />
                <span class="ios-slider"></span>
              </span>
            </label>
            <label class="toggle-card" for="searchEnabled">
              <span>Google Searchを使う</span>
              <span class="ios-switch">
                <input id="searchEnabled" type="checkbox" checked />
                <span class="ios-slider"></span>
              </span>
            </label>
          </div>

          <div class="button-row transcript-toggle-row">
            <button id="transcriptToggle" class="ghost-button" type="button">Transcriptを表示</button>
            <button id="settingsToggle" class="ghost-button" type="button" aria-expanded="false">設定を表示</button>
          </div>

          <div id="settingsPanel" class="settings-panel is-hidden">
            <label class="stack">
              <span>Voice</span>
              <select id="voiceName"></select>
            </label>

            <form id="textForm" class="text-form">
              <label class="stack">
                <span>テキストでも話しかける</span>
                <textarea
                  id="textInput"
                  rows="3"
                  placeholder="例: 目の前にある物を説明して"
                ></textarea>
              </label>
              <div class="text-form-actions">
                <button class="ghost-button" type="submit">送信</button>
              </div>
            </form>

            <div class="hint-box">
              <p>使い方</p>
              <p>1. `Neneを起動` を押す</p>
              <p>2. カメラとマイクの許可を出す</p>
              <p>3. そのまま話しかける</p>
            </div>
          </div>
        </section>

        <section class="panel camera-panel">
          <div class="panel-head">
            <h2>Camera</h2>
            <span id="cameraStateBadge" class="badge">Camera Off</span>
          </div>
          <label class="stack camera-select-stack">
            <span>カメラの向き</span>
            <select id="cameraFacingMode">
              <option value="user">フロントカメラ</option>
              <option value="environment">背面カメラ</option>
            </select>
          </label>
          <div class="camera-frame">
            <video id="cameraPreview" autoplay playsinline muted></video>
            <div id="cameraFallback" class="camera-fallback">
              <p>カメラを起動すると、ここにプレビューが表示されます。</p>
            </div>
          </div>
          <canvas id="captureCanvas" hidden></canvas>
        </section>

        <section id="transcriptPanel" class="panel transcript-panel is-hidden">
          <div class="panel-head">
            <h2>Transcript</h2>
            <span id="tokenCounter" class="badge">Tokens: -</span>
          </div>
          <div id="transcriptList" class="transcript-list"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
