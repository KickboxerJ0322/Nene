name: Set up Nene Firestore

on:
  push:
    branches: [main]
    paths: ['.github/workflows/setup-firestore.yml']
  workflow_dispatch:

concurrency:
  group: nene-firestore-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: jumpeicloud
      GCP_REGION: asia-northeast1
      CLOUD_RUN_SERVICE: nene
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Identify the existing Nene runtime
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/nene-service.json
          runtime_account=$(jq -r '.spec.template.spec.serviceAccountName // empty' /tmp/nene-service.json)
          runtime_image=$(jq -r '.spec.template.spec.containers[0].image // empty' /tmp/nene-service.json)
          if [[ -z "$runtime_account" || -z "$runtime_image" ]]; then
            echo '::error::Cannot identify the Cloud Run runtime account or image.'
            exit 1
          fi
          echo "RUNTIME_ACCOUNT=$runtime_account" >> "$GITHUB_ENV"
          echo "RUNTIME_IMAGE=$runtime_image" >> "$GITHUB_ENV"
          echo "Runtime account: $runtime_account"

      - name: Verify read and write using the runtime identity
        shell: bash
        run: |
          set -euo pipefail
          check_job="nene-firestore-check-$GITHUB_RUN_ID"
          export CHECK_JOB="$check_job"
          python3 - <<'PY'
          import json, os
          script = '''
          import { GoogleAuth } from 'google-auth-library';
          import { randomUUID } from 'node:crypto';
          const auth = new GoogleAuth({ scopes: ['https://www.googleapis.com/auth/cloud-platform'] });
          const client = await auth.getClient();
          const databaseParent = 'https://firestore.googleapis.com/v1/projects/' + process.env.GOOGLE_CLOUD_PROJECT + '/databases';
          try {
            let database;
            try {
              database = (await client.request({ url: databaseParent + '/(default)', timeout: 10000, retry: false })).data;
            } catch (error) {
              if (error.response?.status !== 404) throw error;
              const created = await client.request({ url: databaseParent, method: 'POST', params: { databaseId: '(default)' }, data: { locationId: 'asia-northeast1', type: 'FIRESTORE_NATIVE' }, timeout: 30000, retry: false });
              let operation = created.data;
              for (let attempt = 0; !operation.done && attempt < 100; attempt++) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                operation = (await client.request({ url: 'https://firestore.googleapis.com/v1/' + operation.name, timeout: 10000, retry: false })).data;
              }
              if (!operation.done || operation.error) process.exit(45);
              database = (await client.request({ url: databaseParent + '/(default)', timeout: 10000, retry: false })).data;
            }
            if (database.type !== 'FIRESTORE_NATIVE') process.exit(46);
          } catch (error) {
            const status = error.response?.status;
            console.error('Database setup failed:', status, error.response?.data?.error?.message);
            process.exit(status === 403 ? 43 : status === 404 ? 44 : 45);
          }
          const base = 'https://firestore.googleapis.com/v1/projects/' + process.env.GOOGLE_CLOUD_PROJECT + '/databases/(default)/documents';
          const id = randomUUID();
          let verified = false;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              await client.request({ url: base + '/nene_setup_checks', method: 'POST', params: { documentId: id }, data: { fields: { purpose: { stringValue: 'runtime-permission-check' } } }, timeout: 10000, retry: false });
              await client.request({ url: base + '/nene_setup_checks/' + id, method: 'GET', timeout: 10000, retry: false });
              await client.request({ url: base + '/nene_setup_checks/' + id, method: 'DELETE', timeout: 10000, retry: false });
              verified = true;
              console.log('Firestore read/write/delete verified using the Nene runtime identity. No daily usage slot was consumed.');
              break;
            } catch (error) {
              const status = error.response?.status;
              console.error('Permission check status:', status ?? 'connection error');
              console.error(error.response?.data?.error?.message ?? 'Firestore request failed');
              if (status === 409) {
                await client.request({ url: base + '/nene_setup_checks/' + id, method: 'DELETE', timeout: 10000, retry: false });
              } else if (status !== 403) {
                process.exit(status === 404 ? 44 : status === 401 ? 41 : 1);
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
          }
          if (!verified) process.exit(43);
          '''
          flags = {
            'image': os.environ['RUNTIME_IMAGE'],
            'service-account': os.environ['RUNTIME_ACCOUNT'],
            'command': ['node'],
            'args': ['--input-type=module', '-e', script],
            'set-env-vars': 'GOOGLE_CLOUD_PROJECT=' + os.environ['GCP_PROJECT_ID'],
            'task-timeout': '360s',
            'tasks': 1,
            'max-retries': 0,
            'memory': '512Mi',
            'execute-now': True,
            'wait': True,
          }
          with open('/tmp/nene-check-flags.json', 'w') as f:
            json.dump({'--' + key: value for key, value in flags.items()}, f)
          PY
          trap 'gcloud run jobs delete "$check_job" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --quiet || true' EXIT
          if ! gcloud run jobs deploy "$check_job" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --flags-file=/tmp/nene-check-flags.json --quiet; then
            check_execution=$(gcloud run jobs executions list --job="$check_job" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --limit=1 --format='value(metadata.name)')
            gcloud run jobs executions tasks list --execution="$check_execution" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/nene-check-tasks.json
            jq '.[] | {name: .metadata.name, status: .status}' /tmp/nene-check-tasks.json
            echo 'Exit code 43 means Firestore access denied; 44 means a missing resource; 45 means database creation failed; 46 means an incompatible database mode; 41 means authentication failed.'
            exit 1
          fi
          echo '### Nene Firestore setup verified' >> "$GITHUB_STEP_SUMMARY"
          echo 'Firestore runtime access is ready. Daily usage slots were not consumed.' >> "$GITHUB_STEP_SUMMARY"
